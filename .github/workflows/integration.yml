# Integration tests against MikroTik CHR Docker images
# Runs on PR and pushes to main, also manually triggerable via workflow_dispatch

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MIKROTIK_CHR_IMAGE: "mikrotik/chr"
  RUN_CHR_INTEGRATION: "1"

jobs:
  integration:
    strategy:
      matrix:
        include:
          - chr-tag: "latest"
            label: "CHR latest"
          - chr-tag: "7.22"
            label: "CHR 7.22"
      fail-fast: false

    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Pull CHR image
        run: docker pull ${{ env.MIKROTIK_CHR_IMAGE }}:${{ matrix.chr-tag }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # KVM-independent: only checks the API port comes up, never logs in.
      # QEMU's hostfwd binds this port immediately on container start, well
      # before the RouterOS guest itself has booted, so this passes on
      # standard GitHub-hosted runners.
      - name: Integration tests (smoke)
        run: |
          npx vitest run --config vitest.config.ts test/integration/basic.test.ts
        env:
          MIKROTIK_CHR_IMAGE: "${{ env.MIKROTIK_CHR_IMAGE }}:${{ matrix.chr-tag }}"

      # Requires an actual RouterOS login, which needs the CHR guest to
      # finish booting. CHR runs RouterOS under QEMU/KVM, and standard
      # GitHub-hosted runners (ubuntu-latest) don't expose /dev/kvm, so
      # without hardware acceleration the guest never becomes login-ready
      # within any practical CI budget. Restricted to manual dispatch so it
      # doesn't block every push/PR; run it against a KVM-capable machine
      # (self-hosted runner, or locally) when you need this coverage.
      - name: Integration tests (full, requires KVM)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx vitest run --config vitest.config.ts test/integration/commit-confirm.test.ts
        env:
          MIKROTIK_CHR_IMAGE: "${{ env.MIKROTIK_CHR_IMAGE }}:${{ matrix.chr-tag }}"
