name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Build the package
        run: npm run build
      - name: Typecheck examples
        run: npm run typecheck:examples

  test-integration:
    name: Integration tests (CHR ${{ matrix.chr-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chr-version: ["7.22", "latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Pull CHR image
        run: docker pull mikrotik/chr:${{ matrix.chr-version }}
        continue-on-error: true
      # KVM-independent: only checks the API port comes up, never logs in.
      # See test-integration (full) below for why the login-dependent
      # suite is not run here.
      - name: Run integration tests (smoke)
        run: npm test -- test/integration/basic.test.ts
        env:
          MIKROTIK_CHR_IMAGE: mikrotik/chr:${{ matrix.chr-version }}
        timeout-minutes: 10
      # Requires an actual RouterOS login, which needs the CHR guest to
      # finish booting. CHR runs RouterOS under QEMU/KVM, and standard
      # GitHub-hosted runners (ubuntu-latest) don't expose /dev/kvm, so
      # without hardware acceleration the guest never becomes login-ready
      # within any practical CI budget. Restricted to manual dispatch so
      # it doesn't block every push/PR; run it against a KVM-capable
      # machine (self-hosted runner, or locally) when you need this
      # coverage.
      - name: Run integration tests (full, requires KVM)
        if: github.event_name == 'workflow_dispatch'
        run: npm test -- test/integration/commit-confirm.test.ts
        env:
          MIKROTIK_CHR_IMAGE: mikrotik/chr:${{ matrix.chr-version }}
        timeout-minutes: 10

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Install dependencies
        run: npm install
      - name: Restore tracked files
        run: git restore .
      - name: Build the package
        run: npm run build
      - name: Run semantic-release
        run: npx semantic-release

  deploy-docs:
    name: Deploy Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build documentation
        run: npm run docs:build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
